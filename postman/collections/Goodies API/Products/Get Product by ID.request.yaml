$kind: http-request
name: Get Product by ID
method: GET
url: '{{baseUrl}}/api/goodies/:id'
description: 'Retrieve a single goodie by its ID.'
order: 2000
pathVariables:
  - key: id
    value: '1'
    description: 'The goodie ID'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200 or 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      if (pm.response.code === 200) {
        pm.test("Response has id, name, and price", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("name");
          pm.expect(json).to.have.property("price");
        });
      }

      if (pm.response.code === 404) {
        pm.test("404 response has message field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
        });
      }

      pm.test("Response time is under 1000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(1000);
      });
