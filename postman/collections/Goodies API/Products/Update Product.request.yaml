$kind: http-request
name: Update Product
method: PUT
url: '{{baseUrl}}/api/goodies/:id'
description: 'Update an existing goodie by ID.'
order: 4000
pathVariables:
  - key: id
    value: '1'
    description: 'The goodie ID'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Chocolate Chip Cookie (Updated)",
      "price": 2.75
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200 or 404", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      if (pm.response.code === 200) {
        pm.test("Response has message and goodie", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("goodie");
        });

        pm.test("Updated goodie has id, name, and price", function () {
          const goodie = pm.response.json().goodie;
          pm.expect(goodie).to.have.property("id");
          pm.expect(goodie).to.have.property("name");
          pm.expect(goodie).to.have.property("price");
        });
      }

      pm.test("Response time is under 1000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(1000);
      });
